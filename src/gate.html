<style>[hidden]{display:none!important}</style>
<div id="authGate" class="fixed inset-0 z-[60] bg-slate-900 flex items-center justify-center p-4 overflow-y-auto">
  <div id="agSpin" class="text-slate-400 text-sm">Φόρτωση…</div>
  <div id="agBox" hidden class="w-full max-w-sm">
    <div class="flex items-center gap-3 mb-6 justify-center">
      <div class="w-11 h-11 rounded-xl bg-amber-500 text-slate-900 flex items-center justify-center font-extrabold text-xl">E</div>
      <div><div class="text-white text-xl font-extrabold leading-tight">ΕργοΛόγιο</div><div class="text-slate-400 text-xs">ΔΥΡΑΣ ΤΕΧΝΙΚΗ · Διαχείριση Εργοταξίων</div></div>
    </div>
    <div class="bg-white rounded-2xl p-6 shadow-xl">
      <button id="agGoogle" type="button" class="w-full flex items-center justify-center gap-3 rounded-xl border border-slate-300 py-3 font-semibold text-slate-800 hover:bg-slate-50">
        <svg class="w-5 h-5" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.1H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.6-.4-3.9z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.1H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.6-.4-3.9z"/></svg>
        Σύνδεση με Google</button>
      <div class="flex items-center gap-3 my-5 text-xs text-slate-400"><span class="flex-1 h-px bg-slate-200"></span>ή με email<span class="flex-1 h-px bg-slate-200"></span></div>
      <form id="agForm" class="space-y-3" data-noadvance>
        <div id="agNameRow" hidden><label class="lbl" for="agName">Ονοματεπώνυμο</label><div class="flex gap-2"><input id="agName" class="inp" autocomplete="name" maxlength="80" placeholder="π.χ. Γιάννης Οικονόμου" enterkeyhint="next" onkeydown="if(event.key==='Enter'){event.preventDefault();document.getElementById('agEmail').focus()}"><button type="button" class="ag-ok shrink-0 w-11 rounded-lg bg-emerald-600 text-white text-lg font-bold hover:bg-emerald-700" title="Επόμενο" onclick="document.getElementById('agEmail').focus()">✓</button></div></div>
        <div><label class="lbl" for="agEmail">Email</label><div class="flex gap-2"><input id="agEmail" type="email" class="inp" required autocomplete="email" inputmode="email" enterkeyhint="next" onkeydown="if(event.key==='Enter'){event.preventDefault();document.getElementById('agPass').focus()}"><button type="button" class="ag-ok shrink-0 w-11 rounded-lg bg-emerald-600 text-white text-lg font-bold hover:bg-emerald-700" title="Επόμενο" onclick="document.getElementById('agPass').focus()">✓</button></div></div>
        <div><label class="lbl" for="agPass">Κωδικός</label><div class="relative"><input id="agPass" type="text" class="inp !pr-12" required minlength="6" autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="go"><button type="button" id="agEye" class="absolute right-2 top-1/2 -translate-y-1/2 text-xl px-1.5 text-slate-500 hover:text-slate-900" title="Απόκρυψη / εμφάνιση κωδικού" onclick="const p=document.getElementById('agPass');const h=p.type==='text';p.type=h?'password':'text';this.textContent=h?'👁':'🙈'">🙈</button></div><p class="text-[11px] text-slate-400 mt-1">Τουλάχιστον 6 χαρακτήρες. Ο κωδικός φαίνεται καθώς γράφεις· πάτα 🙈 για απόκρυψη.</p></div>
        <p id="agMsg" class="text-sm min-h-[1.25rem] text-rose-600"></p>
        <button id="agSubmit" class="btn btn-primary w-full !py-3">Σύνδεση</button>
      </form>
      <div class="flex justify-between gap-2 mt-4 text-xs text-slate-500">
        <button id="agToggle" type="button" class="hover:text-slate-900 text-left">Πρώτη φορά εδώ; <b>Δημιουργία λογαριασμού</b></button>
        <button id="agReset" type="button" class="hover:text-slate-900 shrink-0">Ξέχασα τον κωδικό</button>
      </div>
    </div>
    <p class="text-center text-[11px] text-slate-500 mt-4">Μπαίνουν μόνο όσοι εγκρίνει ο διαχειριστής.</p>
  </div>
</div>
