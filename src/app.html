<script>
/* ============ ΣΤΑΘΕΡΕΣ & ΒΟΗΘΗΤΙΚΑ ============ */
const LOCAL_KEY = 'ergologio-docs-v3';
const PAGE_SIZE = 50;
const PALETTE = ['#0ea5e9', '#8b5cf6', '#f59e0b', '#10b981', '#ef4444', '#ec4899', '#14b8a6', '#6366f1',
                 '#84cc16', '#f97316', '#06b6d4', '#a855f7', '#eab308', '#22c55e', '#e11d48', '#3b82f6'];
const PROJECT_SEED = [
  ['Άλιμος', 'Λ. Ποσειδώνος 54, Άλιμος'], ['Κηφισιά', 'Κασσαβέτη 12, Κηφισιά'], ['Πάτρα – Ακρωτήρι', 'Ακρωτηρίου 88, Πάτρα'],
  ['Γλυφάδα', 'Γρ. Λαμπράκη 21, Γλυφάδα'], ['Μαρούσι', 'Βασ. Σοφίας 7, Μαρούσι'], ['Χαλάνδρι', 'Αγ. Παρασκευής 40, Χαλάνδρι'],
  ['Πειραιάς', 'Ακτή Μιαούλη 15, Πειραιάς'], ['Νέα Σμύρνη', 'Ομήρου 33, Νέα Σμύρνη'], ['Ρίο', 'Ακτή Δυμαίων 3, Ρίο'],
  ['Αίγιο', 'Πανεπιστημίου 18, Αίγιο'], ['Κόρινθος', 'Εθν. Αντιστάσεως 9, Κόρινθος'], ['Περιστέρι', 'Θηβών 120, Περιστέρι'],
  ['Βούλα', 'Βασ. Παύλου 66, Βούλα'], ['Πάτρα – Ψηλαλώνια', 'Γούναρη 140, Πάτρα'],
];
const SUPPLIER_SEED = ['Τιτάν Τσιμέντα Α.Ε.', 'Σιδηρεμπορική Αττικής', 'Ξυλεία Παπαδόπουλος Ο.Ε.', 'Ηλεκτρολογικά Δέλτα',
  'Υδραυλικά Αιγαίου Α.Ε.', 'Κεραμικά Πελοποννήσου', 'Χρώματα Βιτέξ Διανομή', 'Δομικά Υλικά Αχαΐας', 'Μεταφορική Ρίου Ο.Ε.',
  'Ενοικιάσεις Μηχανημάτων Λάμπρου', 'Αλουμίνια Πατρών', 'Μονωτικά Ελλάς', 'Λατομεία Αιγιαλείας', 'Σιδηρικά Μαρκόπουλος'];
const ROLES = ['Εργοδηγός', 'Σιδεράς', 'Καλουπατζής', 'Ηλεκτρολόγος', 'Υδραυλικός', 'Εργάτης', 'Πλακάς', 'Ελαιοχρωματιστής'];
const CATEGORIES = ['Εργατικό δυναμικό', 'Μηχανικοί'];
const normRole = r => CATEGORIES.includes(r) ? r : /μηχαν|εργοδηγ/.test(String(r || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase()) ? 'Μηχανικοί' : 'Εργατικό δυναμικό';
const EXTRA_TYPES = ['Υπερωρία', 'Οδοιπορικά', 'Διανυκτέρευση', 'Επίδομα', 'Άλλο'];

const fmt = new Intl.NumberFormat('el-GR', { style: 'currency', currency: 'EUR' });
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Math.random().toString(36).slice(2, 10) + Math.random().toString(36).slice(2, 6);
const iso = d => { const z = new Date(d.getTime() - d.getTimezoneOffset() * 60000); return z.toISOString().slice(0, 10); };
const today = () => iso(new Date());
const addDays = (s, n) => { const d = new Date(s + 'T00:00:00'); d.setDate(d.getDate() + n); return iso(d); };
const dmy = s => { const [y, m, d] = s.split('-'); return `${d}/${m}/${y}`; };
const xlNum = n => (+n).toFixed(2).replace('.', ',');
const r2 = n => Math.round(n * 100) / 100;
/* Ποσά: δέχεται κόμμα ως υποδιαστολή (12,5) — και τελεία. Με κόμμα, οι τελείες θεωρούνται χιλιάδες (1.234,56). */
const parseDec = v => { let t = String(v ?? '').trim().replace(/\s|€/g, ''); if (!t) return NaN;
  t = t.includes(',') ? t.replace(/\./g, '').replace(',', '.') : t; return parseFloat(t); };
const decStr = v => (v === '' || v == null || !isFinite(+v) || +v === 0) ? '' : String(+v).replace('.', ',');
const rnd = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;
const pick = a => a[Math.floor(Math.random() * a.length)];
const sleep = ms => new Promise(r => setTimeout(r, ms));
const initials = n => n.split(' ').filter(Boolean).map(w => w[0]).slice(0, 2).join('');
const monthLabel = ym => { const [y, m] = ym.split('-'); const s = new Date(+y, +m - 1, 1).toLocaleDateString('el-GR', { month: 'long', year: 'numeric' }); return s[0].toUpperCase() + s.slice(1); };
const dot = (c, size = 2.5) => `<span class="inline-block rounded-full shrink-0" style="width:${size * 4}px;height:${size * 4}px;background:${c}"></span>`;
const isObj = v => v !== null && typeof v === 'object' && !Array.isArray(v);
const validId = s => typeof s === 'string' && /^[A-Za-z0-9_-]{1,60}$/.test(s);
const norm = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/ς/g, 'σ').replace(/\s+/g, ' ').trim();
const money0 = new Intl.NumberFormat('el-GR', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 });

/* ---- Ημερομηνίες ΗΗ/ΜΜ/ΕΕΕΕ ---- */
/* Δέχεται 8/8/26, 8.8.26, 8-8-2026, 8/8 (τρέχον έτος), 080826, 08082026 */
function dmyToIso(s) {
  let t = String(s || '').trim().replace(/[.,\-\s]+/g, '/').replace(/\/+/g, '/').replace(/\/$/, '');
  if (/^\d{6}$|^\d{8}$/.test(t)) t = t.slice(0, 2) + '/' + t.slice(2, 4) + '/' + t.slice(4);
  const m = t.match(/^(\d{1,2})\/(\d{1,2})(?:\/(\d{2}|\d{4}))?$/);
  if (!m) return null;
  let [, d, mo, y] = m; if (!y) y = today().slice(0, 4); if (y.length === 2) y = '20' + y;
  const dt = new Date(+y, +mo - 1, +d);
  if (dt.getFullYear() !== +y || dt.getMonth() !== +mo - 1 || dt.getDate() !== +d) return null;
  return `${y}-${String(mo).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
}
function maskDate(el) {
  if (/[\/.,\-\s]/.test(el.value)) {   // έγραψε μόνος του διαχωριστικά (π.χ. 8/8/26): τα κρατάμε όπως είναι
    el.value = el.value.replace(/[.,\-\s]/g, '/').replace(/[^\d\/]/g, '').replace(/\/{2,}/g, '/').replace(/^\//, '').slice(0, 10);
    return;

    && el.tabIndex !== -1 && !el.classList.contains('datepick') && el.offsetParent !== null);

function advanceField(form, el) {

  if (allOk && !later.some(x => !fieldOk(x))) { if (el.onchange) el.dispatchEvent(new Event('change')); form.requestSubmit(); return; }
  const nx = later[0] || f.find(x => x.required && !fieldOk(x));

function totals() {
  const r = {};
  state.projects.forEach(p => r[p.id] = { thirds: 0, thrCount: 0, materials: 0, labor: 0, base: 0, extra: 0, invCount: 0, days: 0, revenue: 0, salCount: 0 });
  state.invoices.forEach(i => { const x = r[i.project]; if (x) { x.materials += i.amount; x.invCount++; } });
  state.sales.forEach(i => { const x = r[i.project]; if (x) { x.revenue += i.amount; x.salCount++; } });
  state.thirds.forEach(i => { const x = r[i.project]; if (x) { x.thirds += i.amount; x.thrCount++; } });
  state.attendance.forEach(a => { const x = r[a.projectId]; if (x) { x.base += a.cost; x.extra += a.extra; x.labor += a.cost + a.extra; x.days++; } });
  state.projects.forEach(p => { r[p.id].transport = transportCost(p, state.attendance.filter(a => a.projectId === p.id)).total; });
  Object.values(r).forEach(x => { x.total = x.materials + x.labor + x.thirds + x.transport; x.result = x.revenue - x.total; });
  return r;
}

let supIdx = -1, supItems = [], supAllOpen = false, supCur = 'fSup', supNext = 'fAmt', supSrc = 'exp';
function supplierField(id, value = '', nextId = '', src = 'exp', req = true) {
  const set = `supCur='${id}';supNext='${nextId}';supSrc='${src}'`;
  return `<div class="relative">
    <input id="${id}" class="inp !pr-10" placeholder="Γράψε 2 γράμματα ή πάτα ▾" ${req ? 'required' : ''} autocomplete="off" autocapitalize="words" spellcheck="false"

      onfocus="${set}" oninput="${set};this.dataset.auto='';supAllOpen=false;supSuggest()" onkeydown="${set};supKey(event)" onblur="setTimeout(supClose,120)">
    <button type="button" class="absolute right-0 top-0 h-full w-10 flex items-center justify-center text-slate-400 hover:text-slate-900" aria-label="Όλη η λίστα"
      onmousedown="event.preventDefault()" onclick="${set};$('#${id}Drop').hidden ? (supSuggest(true), $('#${id}').focus()) : supClose()">▾</button>
    <div id="${id}Drop" hidden role="listbox" class="absolute z-30 left-0 right-0 mt-1 bg-white border border-slate-200 rounded-xl shadow-lg max-h-72 overflow-y-auto"></div>
  </div>`;
}
function supSuggest(showAll) {
  const inp = $('#' + supCur), box = $('#' + supCur + 'Drop'); if (!inp || !box) return;
  if (showAll !== undefined) supAllOpen = showAll;
  const K = KIND[supSrc] || KIND.exp;
  const q = norm(inp.value);
  if (!supAllOpen && q.length < 2) { box.hidden = true; supItems = []; return; }
  const counts = {}; K.list().forEach(i => { const k = norm(i.supName); counts[k] = (counts[k] || 0) + 1; });
  let list = K.parties();
  if (q.length && !(supAllOpen && q.length < 2)) {
    list = list.filter(s => norm(s.name).includes(q))
      .sort((a, b) => (norm(b.name).startsWith(q) - norm(a.name).startsWith(q)) || a.name.localeCompare(b.name, 'el'));
  }
  supItems = list.slice(0, 80).map(s => s.name);
  const exact = K.parties().some(s => norm(s.name) === q);
  const hl = name => { if (!q) return esc(name); const i = norm(name).indexOf(q); return i < 0 ? esc(name) : esc(name.slice(0, i)) + '<b class="text-amber-700">' + esc(name.slice(i, i + q.length)) + '</b>' + esc(name.slice(i + q.length)); };
  supIdx = supItems.length ? 0 : -1;
  box.innerHTML = supItems.map((n, i) => `<button type="button" data-i="${i}" class="sup-opt w-full text-left px-3 py-2.5 text-sm flex justify-between gap-3 hover:bg-amber-50 ${i === 0 ? 'bg-amber-50' : ''}"
      onmousedown="event.preventDefault()" onclick="supPick(${i})"><span class="truncate">${hl(n)}</span><span class="text-xs text-slate-400 shrink-0">${counts[norm(n)] ? counts[norm(n)] + ' ' + (K.unit || 'τιμ.') : ''}</span></button>`).join('')
    + (q.length >= 2 && !exact ? `<div class="px-3 py-2.5 text-xs text-slate-500 border-t border-slate-100 bg-slate-50">＋ ${K.partyNew}: <b class="text-slate-800">${esc(inp.value.trim())}</b> · αποθηκεύεται με την καταχώριση</div>` : '')
    + (!supItems.length && !(q.length >= 2) ? `<div class="px-3 py-3 text-sm text-slate-400">Δεν υπάρχουν αποθηκευμένοι ${K.partyPl} ακόμα.</div>` : '');
  box.hidden = false;
}
function supPick(i) { const n = supItems[i]; if (n == null) return; $('#' + supCur).value = n; supClose(); const nx = supNext && $('#' + supNext); if (nx) nx.focus(); }
function supClose() { document.querySelectorAll('[id$="Drop"][role=listbox]').forEach(b => b.hidden = true); supAllOpen = false; }
function supKey(e) {
  const box = $('#' + supCur + 'Drop'); if (!box || box.hidden) { if (e.key === 'ArrowDown') { supSuggest(true); e.preventDefault(); } return; }
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault(); if (!supItems.length) return;
    supIdx = (supIdx + (e.key === 'ArrowDown' ? 1 : -1) + supItems.length) % supItems.length;
    box.querySelectorAll('.sup-opt').forEach((b, i) => b.classList.toggle('bg-amber-50', i === supIdx));
    const cur = box.querySelector(`.sup-opt[data-i="${supIdx}"]`); if (cur) cur.scrollIntoView({ block: 'nearest' });
  } else if (e.key === 'Enter' && supIdx >= 0 && supItems.length) { e.preventDefault(); supPick(supIdx); }
  else if (e.key === 'Escape') supClose();
}

/* ---- Διπλή καταχώριση ----
   Ίδιο τιμολόγιο = (ίδιος αριθμός και ίδιος προμηθευτής) ή (ίδιος προμηθευτής, ίδια ημερομηνία και ίδιο ποσό).
   Στις πωλήσεις ο αριθμός είναι δικός σου, άρα ίδιος αριθμός = ίδιο τιμολόγιο ανεξάρτητα από πελάτη. */
const noKey = s => norm(s).replace(/[^0-9a-zα-ω]/g, '').replace(/^0+/, '');
function findDuplicate(c, excludeId) {
  const list = KIND[c.kind].list();
  const n = noKey(c.invNo), p = norm(c.supName);
  return list.find(x => x.id !== excludeId && (
    (n && noKey(x.invNo) === n && (c.kind === 'sal' || norm(x.supName) === p)) ||
    (norm(x.supName) === p && x.date === c.date && Math.abs(x.amount - c.amount) < 0.005)));
}

      <button class="btn btn-primary" onclick="closeModal();editInvoiceModal('${x.id}')">Άνοιγμα υπάρχοντος</button></div>`);
}
/* Κοινή καταχώριση/ενημέρωση: επιστρέφει true αν έγινε */
function saveDoc(c, old) {
  const K = KIND[c.kind];
  const dup = findDuplicate(c, old && old.id);
  if (dup) { duplicateModal(dup); return false; }
  const known = K.parties().find(s => norm(s.name) === norm(c.supName));
  const ops = [];
  if (known) c.supName = known.name;
  if (K.opParty && (!known || !known.id)) ops.push(K.opParty(uid(), { name: c.supName }));
  if (old && docPathOf(old) !== docPathOf(c)) ops.push(opDoc(old, true));
  ops.push(opDoc(c));
  commit(ops);
  if (!old) dcInv(c, 'Νέο τιμολόγιο');
  return { newParty: !known };
}

/* ============ ΕΙΣΑΓΩΓΗ ΑΠΟ EXCEL ============
   Δέχεται: ένα φύλλο ανά έργο (το όνομα του φύλλου = έργο) ή ένα φύλλο με στήλη «Έργο».
   Στήλες: Ημ/νία, Κωδικός/Αρ. τιμολογίου, Προμηθευτής (ή Πελάτης/Ονοματεπώνυμο), Αξία. Χωρίς επικεφαλίδες: A=ημ/νία, B=αριθμός, C=προμηθευτής, E=αξία. */

  if (typeof v === 'number' && v > 20000 && v < 80000) { const d = new Date(Math.round((v - 25569) * 864e5)); return `${d.getUTCFullYear()}-${String(d.getUTCMonth() + 1).padStart(2, '0')}-${String(d.getUTCDate()).padStart(2, '0')}`; }

/* ============ ΕΙΔΟΠΟΙΗΣΕΙΣ ============
   Ό,τι έχει ημερομηνία λήξης (ΚΤΕΟ, ασφάλεια, σύμβαση). Ειδοποίηση σε 3 στάδια: 10, 5 και 1 μέρα πριν.

function offDays(recs, m) {
  if (!recs.length) return [];
  const first = recs.reduce((mn, a) => a.date < mn ? a.date : mn, recs[0].date);
  const start = m + '-01' > first ? m + '-01' : first;

}

  const amount = r2(parseDec($('#mAmt').value)); if (!(amount > 0)) return toast('Συμπλήρωσε έγκυρη αξία', 'err');
  const projectId = $('#mProj').value; if (!projectId) return toast('Επίλεξε έργο', 'err');
  let supName = $('#mSup').value.trim().replace(/\s+/g, ' '); if (!supName) return toast('Συμπλήρωσε προμηθευτή', 'err');
  const known = state.suppliers.find(s => norm(s.name) === norm(supName)); if (known) supName = known.name;
  const id = uid();
  const body = { date, invNo: $('#mNo').value.trim(), supName, amount, projectId, projectName: proj(projectId).name, note: $('#mNote').value.trim(),
    status: 'pending', at: Date.now(), by: (emp.staff && emp.staff.name) || myName };
  emp.items = { ...emp.items, [id]: body };
  directWrite('set', `pending/${myUid}/items/${id}`, body).then(() => {}, () => {});
  discord('staff', `🧾 Τιμολόγιο για έγκριση από ${body.by || 'εργαζόμενο'}`, [body.note ? `«${body.note}»` : ''], [['Προμηθευτής', body.supName], ['Αξία', fmt.format(body.amount)], ['Έργο', body.projectName], ['Ημερομηνία', dmy(body.date)]]);
  render(); toast('✓ Στάλθηκε για έγκριση');
}
function withdrawEmpInvoice(id) {
  confirmModal({ title: 'Ακύρωση αποστολής;', ok: 'Ακύρωση τιμολογίου', danger: true, body: '<p>Το τιμολόγιο αφαιρείται από τα εκκρεμή του διαχειριστή.</p>',
    onOk: () => { const n = { ...emp.items }; delete n[id]; emp.items = n; directWrite('del', `pending/${myUid}/items/${id}`).then(() => {}, () => {}); render(); } });
}

/* ============ ΕΚΚΙΝΗΣΗ ============ */
function boot() {
  if (booted) return;
  booted = true; setSync();
  go(ui.view); window.booted = true;
  if (role === 'owner') { updateNavBadge(); scheduleStaffSync(); setTimeout(notifPopup, 600); if (isSuperAdmin) setTimeout(migrateAccess, 1500); }
}
async function init() {
  try { if (!isMobile() && localStorage.getItem('ergologio-navmore') === '1') setNavMore(true); } catch (e) {}
  document.querySelectorAll('[data-nav]').forEach(b => b.classList.toggle('nav-active', b.dataset.nav === ui.view));
  setSync();
  $('#main').innerHTML = `<div class="flex items-center gap-3 text-slate-500 p-8"><svg class="w-5 h-5 animate-spin text-amber-600" fill="none" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3" opacity=".25"/><path d="M22 12a10 10 0 00-10-10" stroke="currentColor" stroke-width="3"/></svg>Φόρτωση δεδομένων…</div>`;
  let ns = null;
  if (window.claude && typeof window.claude.use === 'function') { try { ns = await window.claude.use('db'); } catch (e) { ns = null; } }
  if (ns) {
    db = ns; mode = 'cloud'; setSync('ok');
    try { userNs = await window.claude.use('user'); } catch (e) { userNs = null; }
    if (userNs) {
      let sup = false;
      try { sup = await userNs.isOwner(); } catch (e) {}
      try { myUid = await userNs.id(); } catch (e) {}
      try { const me = await userNs.me(); myName = (me && me.name) || ''; } catch (e) {}
      if (sup) { role = 'owner'; realOwner = true; isSuperAdmin = true; }
      else if (myUid) {
        try { const a = await db.doc(`access/${myUid}`).get(); myAccess = a.exists ? a.data() : null; } catch (e) { myAccess = null; }
        if (myAccess && myAccess.role === 'owner') { role = 'owner'; realOwner = false; }
        else { role = 'employee'; myMods = new Set(Object.entries((myAccess && myAccess.mods) || {}).filter(([, v]) => v).map(([k]) => k)); }
      } else { $('#main').innerHTML = `<div class="card p-6 max-w-lg">Για να χρησιμοποιήσεις τη σελίδα πρέπει να είσαι συνδεδεμένος στον λογαριασμό σου.</div>`; return; }
    }
    watchMyAccess();
    if (role === 'employee') {
      ui.view = firstStaffView() || 'me'; setupStaffNav(); employeeStart();
    } else {
      if (isSuperAdmin) $('#navAdmin')?.classList.remove('hidden');
      listen('meta', false); listen('inv', false); listen('att', false); listen('sal', false); listen('car', false); listen('thr', false);
      ownerExtras();
      setTimeout(() => { if (!booted) { toast('Η φόρτωση αργεί· εμφανίζονται όσα έχουν έρθει μέχρι τώρα.', 'warn'); boot(); } }, 15000);
    }
  } else {
    mode = 'local'; docs = loadLocal(); rebuild(); boot();
  }
}
init();
</script>
